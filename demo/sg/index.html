<!DOCTYPE html>
<html>
  <head>
    <title>Supergrid API Reference</title>
    <!-- needed for adaptive design -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="../assets/plugins/redoc/assets/favicon.ico" type="image/x-icon" />

    <style>
      body {
        margin: 0;
        padding: 0;
      }

      .download-button {
        border: 1px solid rgb(55, 181, 255);
        color: rgb(55, 181, 255);
        font-weight: normal;
        margin-left: 0.5em;
        padding: 4px 8px;
        display: inline-block;
        text-decoration: none;
        cursor: pointer;
        box-sizing: border-box;
        -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
      }
    </style>
  </head>

  <body>
    <div
      style="
        text-align: right;
        height: 30px;
        padding: 19px;
        font-family: 'Open Sans', sans-serif;
        font-weight: 400;
        line-height: 1.5em;
        font-size: 14px;
      "
    >
      <span id="DownloadButtonSpan">
        <a target="_blank" href="../Export/ExportApiDoc" class="download-button"
          >Download HTML Version</a
        >
      </span>
      <span style="margin-left: 10px">
        <label for="ApiSources">Tempus Api:</label>
        <select id="ApiSources" onchange="changeRedoc(this)">
          <option selected value="0">Supergrid</option>
          <option value="1">What If</option>
        </select>
      </span>
    </div>

    <div id="redoc"></div>

    <script src="../assets/plugins/redoc/redoc.standalone.js"></script>
    <script>
      const apis = ['../swagger/sg/swagger.json', '../swagger/t5/swagger.json'];
      const isLocal = window.location.protocol == 'file:';

      function initRedoc(url) {
        Redoc.init(
          url,
          {
            hideDownloadButton: isLocal,
            theme: {
              colors: {
                primary: {
                  main: '#37B5FF',
                },
              },
              typography: {
                fontWeightRegular: '400',
                fontWeightBold: '700',
                fontWeightLight: '300',
                fontFamily: "'Open Sans', sans-serif",
                headings: {
                  fontFamily: "'Open Sans', sans-serif",
                },
              },
              logo: {
                maxWidth: '150px',
                maxHeight: '60px',
                gutter: '10px 20px',
              },
              rightPanel: {
                backgroundColor: '#fff',
              },
              codeBlock: {
                backgroundColor: '#263238',
              },
              schema: {
                defaultDetailsWidth: '100%',
              },
            },
          },
          document.getElementById('redoc'),
        );
      }

      initRedoc(apis[0]);

      function changeRedoc(selectObject) {
        var value = selectObject.value;
        initRedoc(apis[value]);
      }

      function initCheck() {
        if (isLocal) {
          document.getElementById('DownloadButtonSpan').style.display = 'none';
        }
      }

      initCheck();
    </script>
  </body>
</html>
